[package]
name = "vecta-neural"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust quantized XLM-RoBERTa Bi-Encoder, Cross-Encoder, and Semantic Index engine"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
memmap2 = "0.9"
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
vecta-taxonomy = { path = "../vecta-taxonomy" }
