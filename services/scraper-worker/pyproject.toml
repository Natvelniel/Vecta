[project]
name = "vecta-scraper-worker"
version = "0.1.0"
description = "Stateless multi-source job scraper and HTML cleaner worker for Vecta"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "python-jobspy>=1.1.75",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
