[package]
name = "vecta"
version = "0.5.0"
description = "Vecta local-first AI career intelligence core engine"
authors = ["Vecta"]
edition = "2021"

[lib]
name = "vecta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
candle-core = "0.11.1"
candle-nn = "0.11.1"
chrono = { version = "0.4", features = ["serde"] }
memmap2 = "0.9"
pdf-extract = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "^0.0.15"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
typst = "0.15"
typst-as-lib = "0.18"
typst-pdf = "0.15"
url = "2"
uuid = { version = "1", features = ["v4"] }
vecta-taxonomy = { path = "../../../crates/vecta-taxonomy" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[target.'cfg(target_os = "android")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
