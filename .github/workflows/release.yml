name: Release Vecta (Windows & Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        default: "v0.4.0"
      include_windows:
        description: "Also build Windows desktop installers (NSIS/MSI/Portable)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (NSIS, MSI & Portable ZIP)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_windows == true }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python & build Neural Engine v2 offline AI pack (~424 MB)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Neural v2 quantized models & semantic taxonomy index
        shell: pwsh
        run: |
          python -m pip install --upgrade pip numpy
          python scripts/fetch_offline_ai_model.py
          python scripts/build_neural_v2_pack.py
          cargo run --release -p vecta-neural --bin build_semantic_index -- --pack-dir apps/client/src-tauri/resources/models/neural-v2

      - name: Install frontend dependencies
        working-directory: apps/client
        run: npm ci

      - name: Build Tauri Windows installers (NSIS .exe & MSI)
        working-directory: apps/client
        run: npm run tauri build

      - name: Stage Windows release packages
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $outDir = "release-artifacts-windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination $outDir
          Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination $outDir

          $stage = "portable-stage/Vecta"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/vecta.exe" "$stage/"
          Copy-Item -Recurse "apps/client/src-tauri/resources" "$stage/resources"
          Copy-Item "LICENSE" "$stage/"
          Copy-Item "README.md" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "$outDir/Vecta_${tag}_windows_x64_portable.zip" -CompressionLevel Optimal
          Get-ChildItem -Path $outDir | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts-windows/*

  build-android:
    name: Build Android arm64 APK (Click-to-Install)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Preinstalled Android SDK & NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          NDK_DIR=$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            "$SDKMANAGER" "ndk;27.2.12479018"
            NDK_DIR="$SDK/ndk/27.2.12479018"
          fi

          BT_DIR=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BT_DIR" ]; then
            "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"
            BT_DIR="$SDK/build-tools/35.0.0"
          fi

          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$BT_DIR" >> "$GITHUB_ENV"
          echo "Using SDK=$SDK | NDK=$NDK_DIR | BUILD_TOOLS=$BT_DIR"

      - name: Setup Rust stable with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python & build Neural Engine v2 offline pack (~424 MB)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Neural v2 quantized models & semantic taxonomy index
        run: |
          python3 -m pip install --upgrade pip numpy
          python3 scripts/build_neural_v2_pack.py
          cargo run --release -p vecta-neural --bin build_semantic_index -- --pack-dir apps/client/src-tauri/resources/models/neural-v2

      - name: Install frontend dependencies
        working-directory: apps/client
        run: npm ci

      - name: Initialize & Build Android arm64 APK
        working-directory: apps/client
        env:
          CI: "true"
        run: |
          npx tauri android init --ci --skip-targets-install
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          if "noCompress" not in text:
              needle = "android {"
              assert needle in text, "android block not found in build.gradle.kts"
              patch = 'android {\n    androidResources {\n        noCompress += listOf("vtxr", "vidx", "vemb", "json")\n    }'
              gradle.write_text(text.replace(needle, patch, 1), encoding="utf-8")
          PY
          npx tauri icon src-tauri/icons/app-icon.png
          python3 - <<'PY'
          from pathlib import Path
          for target in [
              Path("src-tauri/icons/android/values/ic_launcher_background.xml"),
              Path("src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml"),
          ]:
              if target.parent.exists():
                  target.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#09090B</color>\n</resources>\n', encoding="utf-8")
          PY
          npx tauri android build --apk --target aarch64 --ci

      - name: Align & Sign Android APK for 1-Tap Install
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          OUT_DIR="release-artifacts-android"
          mkdir -p "$OUT_DIR"

          RAW_APK=$(find apps/client/src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No release APK found under gen/android/app/build/outputs/apk"
            find apps/client/src-tauri/gen/android/app/build/outputs -maxdepth 4 -type f
            exit 1
          fi
          echo "Found raw APK: $RAW_APK"

          RAW_APK="$RAW_APK" python3 - <<'PY'
          import os, pathlib, zipfile
          raw_apk = pathlib.Path(os.environ["RAW_APK"])
          pack_dir = pathlib.Path("apps/client/src-tauri/resources/models/neural-v2")
          required = ["e5-base.vtxr", "mmarco-reranker.vtxr", "semantic_index.vidx", "tokenizer.json", "manifest.json"]
          with zipfile.ZipFile(raw_apk, "r") as zf:
              names = set(zf.namelist())
          has_e5 = any(n.endswith("/e5-base.vtxr") or n == "assets/models/neural-v2/e5-base.vtxr" for n in names)
          if not has_e5:
              print("Injecting neural-v2 pack uncompressed into APK assets/models/neural-v2/...")
              with zipfile.ZipFile(raw_apk, "a") as zf:
                  for fn in required:
                      src = pack_dir / fn
                      assert src.exists(), f"Missing neural pack file: {src}"
                      zf.write(src, arcname=f"assets/models/neural-v2/{fn}", compress_type=zipfile.ZIP_STORED)
          with zipfile.ZipFile(raw_apk, "r") as zf:
              all_names = zf.namelist()
              for fn in required[:-1]:
                  assert any(n.endswith(f"/{fn}") for n in all_names), f"APK missing bundled asset: {fn}"
          print("Verified APK bundles neural-v2 pack cleanly:", len(all_names), "entries")
          PY

          BUILD_TOOLS="${ANDROID_BUILD_TOOLS}"
          ALIGNED_APK="$RUNNER_TEMP/vecta-aligned.apk"
          SIGNED_APK="$OUT_DIR/Vecta_${TAG}_android_arm64.apk"
          KS_PATH="$RUNNER_TEMP/vecta-release.jks"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" "$ALIGNED_APK"

          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Signing APK with repository release keystore secret..."
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$KS_PATH"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-vecta}"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; generating PKCS12 signing key for click-to-install APK..."
            KS_ALIAS="vecta"
            KS_PASS="vecta-release-key"
            KEY_PASS="vecta-release-key"
            keytool -genkeypair -noprompt \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Vecta, OU=Release, O=Natvelniel, L=Indonesia, S=ID, C=ID"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:${KS_PASS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: release-artifacts-android/*.apk

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-windows, build-android]
    if: ${{ always() && needs.build-android.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          rm -f SHA256SUMS.txt
          sha256sum $(ls -1 | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Vecta ${{ github.event.inputs.tag || github.ref_name }} - Mobile-First Local Career OS"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Vecta Universal Local-First Career OS

            Local-first career intelligence across **23 Indonesian academic and industry domains** (**917 skills, 238 roles**) with **zero-setup Native Rust scraping** (JobStreet, LinkedIn Guest, Kalibrr, Dealls, Glints, Indeed), **Red-Flag Scam Detection**, **0-Token Local Roadmap & Interview STAR**, **Application Pipeline + Follow-Up Kit**, **Live A4 CV Preview**, **Multi-Profile Switcher**, and **1-Click ATS PDF Export (Typst)**.

            ### Android Download (Ready to Install)
            - **Android (`.apk`):** Download `Vecta_*_android_arm64.apk` directly on your phone -> tap the file -> **Install** (no ZIP extraction needed; allow "Install unknown apps" once if prompted).
            - **Checksums (`SHA256SUMS.txt`):** SHA-256 verification hash for release integrity.

            No Python installation and no Gemini API key are required for core discovery, skill matching, PDF CV import, roadmap, interview STAR prep, or ATS PDF export. Windows desktop packages can also be triggered via `workflow_dispatch` (`include_windows: true`).
          files: |
            release-artifacts/*.apk
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
