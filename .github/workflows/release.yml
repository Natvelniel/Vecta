name: Release Vecta Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (NSIS, MSI & Portable ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python & build offline 101-language AI model (~142 MB)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and quantize offline multilingual model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip numpy
          python scripts/fetch_offline_ai_model.py

      - name: Install frontend dependencies
        working-directory: apps/client
        run: npm ci

      - name: Build Tauri Windows installers (NSIS .exe & MSI)
        working-directory: apps/client
        run: npm run tauri build

      - name: Package Portable ZIP & SHA256SUMS
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Copy NSIS & MSI installers
          Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination $outDir
          Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination $outDir

          # Build Portable ZIP (vecta.exe + bundled offline AI + ATS fonts)
          $stage = "portable-stage/Vecta"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/vecta.exe" "$stage/"
          Copy-Item -Recurse "apps/client/src-tauri/resources" "$stage/resources"
          Copy-Item "LICENSE" "$stage/"
          Copy-Item "README.md" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "$outDir/Vecta_${tag}_windows_x64_portable.zip" -CompressionLevel Optimal

          # Generate SHA256SUMS.txt (materialize file list before writing output file)
          $filesToHash = @(Get-ChildItem -Path $outDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name)
          $checksumLines = $filesToHash | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksumLines | Out-File -Encoding ascii -FilePath "$outDir/SHA256SUMS.txt"
          Get-ChildItem -Path $outDir | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Vecta ${{ github.event.inputs.tag || github.ref_name }} - Universal Local-First Career OS"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Vecta Universal Local-First Career OS

            Ready-to-run Windows x64 packages with **bundled 101-language offline multilingual AI**, **14-domain Indonesian skill taxonomy**, **zero-setup Native Rust scraper** (JobStreet, LinkedIn Guest, Kalibrr, Dealls, Indeed), **Red-Flag Scam Detector**, **Instant PDF CV Import**, and **1-Click ATS PDF Export (Typst)**.

            ### Downloads
            - **`.exe` (NSIS Setup):** Recommended Windows installer.
            - **`.msi` (Windows Installer):** Standard MSI package.
            - **`_portable.zip`:** Extract and run `vecta.exe` without installation.
            - **`SHA256SUMS.txt`:** SHA-256 verification checksums.

            No Python installation and no Gemini API key are required for core discovery, offline semantic matching, PDF import, or ATS CV export.
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
